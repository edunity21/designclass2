<rect x="56.0" y="44" width="41.9" height="28" rx="14.0" fill="#F5C518"/><text x="77.0" y="63.4" font-size="15" font-weight="800" fill="#0B0B0B" text-anchor="middle">03</text><text x="109.92421875" y="63" font-size="16" font-weight="600" fill="#B3B3B3" text-anchor="start" letter-spacing="0.5"><tspan x="109.92421875" dy="0">단원 평가 계획 · 총괄평가 과제 개발 (GRASPS)</tspan></text><text x="56" y="120" font-size="38" font-weight="800" fill="#FFFFFF" text-anchor="start" letter-spacing="-0.6"><tspan x="56" dy="0">나는 학교 진로 채널의 ‘1분 산업 리포터’</tspan></text>
<rect x="56.0" y="164" width="324.6666666666667" height="216" rx="18" fill="#1E1E1E"/><text x="78.0" y="230" font-size="58" font-weight="900" fill="#1DB954" text-anchor="start" letter-spacing="-2"><tspan x="78.0" dy="0">G</tspan></text><text x="126.0" y="214" font-size="18" font-weight="800" fill="#FFFFFF" text-anchor="start"><tspan x="126.0" dy="0">목표</tspan></text><text x="126.0" y="234" font-size="12.5" font-weight="700" fill="#7A7A7A" text-anchor="start"><tspan x="126.0" dy="0">Goal</tspan></text><text x="78.0" y="272" font-size="15.5" font-weight="600" fill="#FFFFFF" text-anchor="start"><tspan x="78.0" dy="0">고른 음악 산업이 무엇을 하는 곳이며 음악이</tspan><tspan x="78.0" dy="22.5">어떤 값어치를 만드는지 조사해, 1분 안에</tspan><tspan x="78.0" dy="22.5">설명하는 「음악 산업 1분 리포트」</tspan></text><rect x="392.6666666666667" y="164" width="324.6666666666667" height="216" rx="18" fill="#1E1E1E"/><text x="414.6666666666667" y="230" font-size="58" font-weight="900" fill="#F5C518" text-anchor="start" letter-spacing="-2"><tspan x="414.6666666666667" dy="0">R</tspan></text><text x="462.6666666666667" y="214" font-size="18" font-weight="800" fill="#FFFFFF" text-anchor="start"><tspan x="462.6666666666667" dy="0">역할</tspan></text><text x="462.6666666666667" y="234" font-size="12.5" font-weight="700" fill="#7A7A7A" text-anchor="start"><tspan x="462.6666666666667" dy="0">Role</tspan></text><text x="414.6666666666667" y="288" font-size="25" font-weight="900" fill="#FFFFFF" text-anchor="start" letter-spacing="-0.5"><tspan x="414.6666666666667" dy="0">학교 진로 채널의</tspan><tspan x="414.6666666666667" dy="32.5">‘1분 산업 리포터’</tspan></text><rect x="729.3333333333334" y="164" width="324.6666666666667" height="216" rx="18" fill="#1E1E1E"/><text x="751.3333333333334" y="230" font-size="58" font-weight="900" fill="#EC4899" text-anchor="start" letter-spacing="-2"><tspan x="751.3333333333334" dy="0">A</tspan></text><text x="799.3333333333334" y="214" font-size="18" font-weight="800" fill="#FFFFFF" text-anchor="start"><tspan x="799.3333333333334" dy="0">청중</tspan></text><text x="799.3333333333334" y="234" font-size="12.5" font-weight="700" fill="#7A7A7A" text-anchor="start"><tspan x="799.3333333333334" dy="0">Audience</tspan></text><text x="751.3333333333334" y="272" font-size="15.5" font-weight="600" fill="#FFFFFF" text-anchor="start"><tspan x="751.3333333333334" dy="0">“음악은 내 일이 아니야”라고 생각하는 같은 반</tspan><tspan x="751.3333333333334" dy="22.5">친구들(중학교 3학년)</tspan></text><rect x="56.0" y="392" width="324.6666666666667" height="216" rx="18" fill="#1E1E1E"/><text x="78.0" y="458" font-size="58" font-weight="900" fill="#4D8DFF" text-anchor="start" letter-spacing="-2"><tspan x="78.0" dy="0">S</tspan></text><text x="126.0" y="442" font-size="18" font-weight="800" fill="#FFFFFF" text-anchor="start"><tspan x="126.0" dy="0">상황</tspan></text><text x="126.0" y="462" font-size="12.5" font-weight="700" fill="#7A7A7A" text-anchor="start"><tspan x="126.0" dy="0">Situation</tspan></text><text x="78.0" y="500" font-size="15.5" font-weight="600" fill="#FFFFFF" text-anchor="start"><tspan x="78.0" dy="0">진학을 앞두고 진로를 고민하는 친구들은</tspan><tspan x="78.0" dy="22.5">음악이 어떤 일터에서 쓰이는지 잘 모른다.</tspan><tspan x="78.0" dy="22.5">조사·제출은 수업 시간 안에서만, 발표는</tspan><tspan x="78.0" dy="22.5">60초 안에</tspan></text><rect x="392.6666666666667" y="392" width="324.6666666666667" height="216" rx="18" fill="#1E1E1E"/><text x="414.6666666666667" y="458" font-size="58" font-weight="900" fill="#F5A524" text-anchor="start" letter-spacing="-2"><tspan x="414.6666666666667" dy="0">P</tspan></text><text x="462.6666666666667" y="442" font-size="18" font-weight="800" fill="#FFFFFF" text-anchor="start"><tspan x="462.6666666666667" dy="0">결과물</tspan></text><text x="462.6666666666667" y="462" font-size="12.5" font-weight="700" fill="#7A7A7A" text-anchor="start"><tspan x="462.6666666666667" dy="0">Product</tspan></text><text x="414.6666666666667" y="500" font-size="15.5" font-weight="600" fill="#FFFFFF" text-anchor="start"><tspan x="414.6666666666667" dy="0">친구들이 한 분야를 1분 안에 이해하도록 ‘조사</tspan><tspan x="414.6666666666667" dy="22.5">활동지(9문항)’와 ‘1분 발표 영상’</tspan></text><rect x="729.3333333333334" y="392" width="324.6666666666667" height="216" rx="18" fill="#1E1E1E"/><text x="751.3333333333334" y="458" font-size="58" font-weight="900" fill="#2EC4B6" text-anchor="start" letter-spacing="-2"><tspan x="751.3333333333334" dy="0">S</tspan></text><text x="799.3333333333334" y="442" font-size="18" font-weight="800" fill="#FFFFFF" text-anchor="start"><tspan x="799.3333333333334" dy="0">기준</tspan></text><text x="799.3333333333334" y="462" font-size="12.5" font-weight="700" fill="#7A7A7A" text-anchor="start"><tspan x="799.3333333333334" dy="0">Standard</tspan></text><text x="751.3333333333334" y="494" font-size="13.5" font-weight="600" fill="#FFFFFF" text-anchor="start"><tspan x="751.3333333333334" dy="0">① 하는 일 자기 말 2문장+ · 직업 2가지+ ·</tspan><tspan x="751.3333333333334" dy="20.2">조사처 2곳+</tspan><tspan x="751.3333333333334" dy="20.2">② 쓰이는 장면 + 사라지는 것을 산업의 일과 이어 설명</tspan><tspan x="751.3333333333334" dy="20.2">③ ‘무슨 분야 → 어떻게 쓰이나 → 왜 중요한가’</tspan><tspan x="751.3333333333334" dy="20.2">50초~1분</tspan></text><rect x="56" y="620" width="493.0" height="146" rx="18" fill="#0E2A18" stroke="#1DB954" stroke-width="1.5"/><g transform="translate(78 640) scale(1.0000)" fill="none" stroke="#1DB954" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 8V4H8" />
  <rect width="16" height="12" x="4" y="8" rx="2" />
  <path d="M2 14h2" />
  <path d="M20 14h2" />
  <path d="M15 13v2" />
  <path d="M9 13v2" /></g><text x="112" y="659" font-size="18" font-weight="800" fill="#1DB954" text-anchor="start"><tspan x="112" dy="0">AI 활용 가능</tspan></text><text x="78" y="690" font-size="15" font-weight="600" fill="#FFFFFF" text-anchor="start"><tspan x="78" dy="0">조사 중 낯선 용어를 풀어 보거나 검색어를 넓힐 때 → 활동지 5번에 조사처로</tspan><tspan x="78" dy="21.8">적고, 다른 조사처에서 사실을 한 번 더 확인</tspan></text><rect x="561.0" y="620" width="493.0" height="146" rx="18" fill="#2A1416" stroke="#F0616B" stroke-width="1.5"/><g transform="translate(583.0 640) scale(1.0000)" fill="none" stroke="#F0616B" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 11V6a2 2 0 0 0-2-2a2 2 0 0 0-2 2" />
  <path d="M14 10V4a2 2 0 0 0-2-2a2 2 0 0 0-2 2v2" />
  <path d="M10 10.5V6a2 2 0 0 0-2-2a2 2 0 0 0-2 2v8" />
  <path d="M18 8a2 2 0 1 1 4 0v6a8 8 0 0 1-8 8h-2c-2.8 0-4.5-.86-5.99-2.34l-3.6-3.6a2 2 0 0 1 2.83-2.82L7 15" /></g><text x="617.0" y="659" font-size="18" font-weight="800" fill="#F0616B" text-anchor="start"><tspan x="617.0" dy="0">학생이 직접</tspan></text><text x="583.0" y="690" font-size="15" font-weight="600" fill="#FFFFFF" text-anchor="start"><tspan x="583.0" dy="0">분야 선택과 이유 · 3·6·7번 서술 · 발표 원고 세 문장 · 영상 촬영 — AI</tspan><tspan x="583.0" dy="21.8">답변이나 자료집 문장을 그대로 옮긴 답은 조사로 인정하지 않음</tspan></text>
<text x="1070" y="784" font-size="13" font-weight="500" fill="#555555" text-anchor="end"><tspan x="1070" dy="0">음악산업탐구 · 단원 설계</tspan></text>
</g>
