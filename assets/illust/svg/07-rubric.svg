<rect x="56.0" y="44" width="41.9" height="28" rx="14.0" fill="#4D8DFF"/><text x="77.0" y="63.4" font-size="15" font-weight="800" fill="#0B0B0B" text-anchor="middle">03</text><text x="109.92421875" y="63" font-size="16" font-weight="600" fill="#B3B3B3" text-anchor="start" letter-spacing="0.5"><tspan x="109.92421875" dy="0">단원 평가 계획 · 루브릭 (100점)</tspan></text><text x="56" y="120" font-size="38" font-weight="800" fill="#FFFFFF" text-anchor="start" letter-spacing="-0.6"><tspan x="56" dy="0">길이가 아니라 정확성과 연결을 본다</tspan></text>
<rect x="56" y="160" width="998" height="176" rx="18" fill="#1E1E1E"/><circle cx="104" cy="212" r="26" fill="#4D8DFF" opacity="0.16"/><g transform="translate(91 199) scale(1.0833)" fill="none" stroke="#4D8DFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8" />
  <path d="m21 21-4.3-4.3" /></g><text x="80" y="272" font-size="19" font-weight="800" fill="#FFFFFF" text-anchor="start"><tspan x="80" dy="0">산업 조사</tspan></text><text x="80" y="308" font-size="24" font-weight="900" fill="#4D8DFF" text-anchor="start"><tspan x="80" dy="0">40점</tspan></text><rect x="286" y="174" width="752" height="46" rx="12" fill="#2A2A2A"/><rect x="300.0" y="184" width="28.7" height="26" rx="13.0" fill="#4D8DFF"/><text x="314.4" y="202.0" font-size="14" font-weight="900" fill="#0B0B0B" text-anchor="middle">A</text><text x="368" y="204" font-size="20" font-weight="900" fill="#4D8DFF" text-anchor="end"><tspan x="368" dy="0">40</tspan></text><rect x="380" y="192" width="110" height="10" rx="5" fill="#333"/><rect x="380" y="192" width="110.0" height="10" rx="5" fill="#4D8DFF"/><text x="508" y="203" font-size="15" font-weight="600" fill="#FFFFFF" text-anchor="start"><tspan x="508" dy="0">하는 일 자기 말 2문장 이상 · 직업 2가지 이상과 하는 일 · 서로 다른 조사처 2곳 이상</tspan></text><rect x="286" y="226" width="752" height="46" rx="12" fill="#2A2A2A"/><rect x="300.0" y="236" width="27.1" height="26" rx="13.0" fill="#B3B3B3"/><text x="313.5" y="254.0" font-size="14" font-weight="900" fill="#0B0B0B" text-anchor="middle">B</text><text x="368" y="256" font-size="20" font-weight="900" fill="#B3B3B3" text-anchor="end"><tspan x="368" dy="0">30</tspan></text><rect x="380" y="244" width="110" height="10" rx="5" fill="#333"/><rect x="380" y="244" width="82.5" height="10" rx="5" fill="#B3B3B3"/><text x="508" y="255" font-size="15" font-weight="500" fill="#B3B3B3" text-anchor="start"><tspan x="508" dy="0">하는 일과 직업은 밝혔으나 한 문장 · 직업 한 가지 · 조사처 한 곳에 그침</tspan></text><rect x="286" y="278" width="752" height="46" rx="12" fill="#2A2A2A"/><rect x="300.0" y="288" width="28.4" height="26" rx="13.0" fill="#7A7A7A"/><text x="314.2" y="306.0" font-size="14" font-weight="900" fill="#0B0B0B" text-anchor="middle">C</text><text x="368" y="308" font-size="20" font-weight="900" fill="#7A7A7A" text-anchor="end"><tspan x="368" dy="0">10</tspan></text><rect x="380" y="296" width="110" height="10" rx="5" fill="#333"/><rect x="380" y="296" width="27.5" height="10" rx="5" fill="#7A7A7A"/><text x="508" y="307" font-size="15" font-weight="500" fill="#B3B3B3" text-anchor="start"><tspan x="508" dy="0">산업 이름과 대강의 내용만 — 스스로 조사한 내용이 드러나지 않음</tspan></text><rect x="56" y="348" width="998" height="176" rx="18" fill="#1E1E1E"/><circle cx="104" cy="400" r="26" fill="#1DB954" opacity="0.16"/><g transform="translate(91 387) scale(1.0833)" fill="none" stroke="#1DB954" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 3h12l4 6-10 13L2 9Z" />
  <path d="M11 3 8 9l4 13 4-13-3-6" />
  <path d="M2 9h20" /></g><text x="80" y="460" font-size="19" font-weight="800" fill="#FFFFFF" text-anchor="start"><tspan x="80" dy="0">음악의 활용 가치</tspan></text><text x="80" y="496" font-size="24" font-weight="900" fill="#1DB954" text-anchor="start"><tspan x="80" dy="0">30점</tspan></text><rect x="286" y="362" width="752" height="46" rx="12" fill="#13261B"/><rect x="300.0" y="372" width="28.7" height="26" rx="13.0" fill="#1DB954"/><text x="314.4" y="390.0" font-size="14" font-weight="900" fill="#0B0B0B" text-anchor="middle">A</text><text x="368" y="392" font-size="20" font-weight="900" fill="#1DB954" text-anchor="end"><tspan x="368" dy="0">30</tspan></text><rect x="380" y="380" width="110" height="10" rx="5" fill="#333"/><rect x="380" y="380" width="82.5" height="10" rx="5" fill="#1DB954"/><text x="508" y="391" font-size="15" font-weight="600" fill="#FFFFFF" text-anchor="start"><tspan x="508" dy="0">쓰이는 장면을 구체적으로 + 음악이 없을 때 사라지는 것을 산업의 일과 이어 설명</tspan></text><rect x="286" y="414" width="752" height="46" rx="12" fill="#2A2A2A"/><rect x="300.0" y="424" width="27.1" height="26" rx="13.0" fill="#B3B3B3"/><text x="313.5" y="442.0" font-size="14" font-weight="900" fill="#0B0B0B" text-anchor="middle">B</text><text x="368" y="444" font-size="20" font-weight="900" fill="#B3B3B3" text-anchor="end"><tspan x="368" dy="0">20</tspan></text><rect x="380" y="432" width="110" height="10" rx="5" fill="#333"/><rect x="380" y="432" width="55.0" height="10" rx="5" fill="#B3B3B3"/><text x="508" y="443" font-size="15" font-weight="500" fill="#B3B3B3" text-anchor="start"><tspan x="508" dy="0">장면은 들었으나, 음악이 없을 때를 개인의 감상 수준으로만 적음</tspan></text><rect x="286" y="466" width="752" height="46" rx="12" fill="#2A2A2A"/><rect x="300.0" y="476" width="28.4" height="26" rx="13.0" fill="#7A7A7A"/><text x="314.2" y="494.0" font-size="14" font-weight="900" fill="#0B0B0B" text-anchor="middle">C</text><text x="368" y="496" font-size="20" font-weight="900" fill="#7A7A7A" text-anchor="end"><tspan x="368" dy="0">10</tspan></text><rect x="380" y="484" width="110" height="10" rx="5" fill="#333"/><rect x="380" y="484" width="27.5" height="10" rx="5" fill="#7A7A7A"/><text x="508" y="495" font-size="15" font-weight="500" fill="#B3B3B3" text-anchor="start"><tspan x="508" dy="0">음악이 쓰인다는 사실만 — 쓰이는 장면이나 값어치가 드러나지 않음</tspan></text><rect x="56" y="536" width="998" height="176" rx="18" fill="#1E1E1E"/><circle cx="104" cy="588" r="26" fill="#F5A524" opacity="0.16"/><g transform="translate(91 575) scale(1.0833)" fill="none" stroke="#F5A524" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2a3 3 0 0 0-3 3v7a3 3 0 0 0 6 0V5a3 3 0 0 0-3-3Z" />
  <path d="M19 10v2a7 7 0 0 1-14 0v-2" />
  <line x1="12" x2="12" y1="19" y2="22" /></g><text x="80" y="648" font-size="19" font-weight="800" fill="#FFFFFF" text-anchor="start"><tspan x="80" dy="0">발표 수행</tspan></text><text x="80" y="684" font-size="24" font-weight="900" fill="#F5A524" text-anchor="start"><tspan x="80" dy="0">30점</tspan></text><rect x="286" y="550" width="752" height="46" rx="12" fill="#2A2A2A"/><rect x="300.0" y="560" width="28.7" height="26" rx="13.0" fill="#F5A524"/><text x="314.4" y="578.0" font-size="14" font-weight="900" fill="#0B0B0B" text-anchor="middle">A</text><text x="368" y="580" font-size="20" font-weight="900" fill="#F5A524" text-anchor="end"><tspan x="368" dy="0">30</tspan></text><rect x="380" y="568" width="110" height="10" rx="5" fill="#333"/><rect x="380" y="568" width="82.5" height="10" rx="5" fill="#F5A524"/><text x="508" y="579" font-size="15" font-weight="600" fill="#FFFFFF" text-anchor="start"><tspan x="508" dy="0">핵심 문장을 짜임새 있게, 50초~1분 동안 설득력 있게 발표</tspan></text><rect x="286" y="602" width="752" height="46" rx="12" fill="#2A2A2A"/><rect x="300.0" y="612" width="27.1" height="26" rx="13.0" fill="#B3B3B3"/><text x="313.5" y="630.0" font-size="14" font-weight="900" fill="#0B0B0B" text-anchor="middle">B</text><text x="368" y="632" font-size="20" font-weight="900" fill="#B3B3B3" text-anchor="end"><tspan x="368" dy="0">20</tspan></text><rect x="380" y="620" width="110" height="10" rx="5" fill="#333"/><rect x="380" y="620" width="55.0" height="10" rx="5" fill="#B3B3B3"/><text x="508" y="631" font-size="15" font-weight="500" fill="#B3B3B3" text-anchor="start"><tspan x="508" dy="0">원고나 화면을 읽는 데 그치거나, 발표 시간을 지키지 못함</tspan></text><rect x="286" y="654" width="752" height="46" rx="12" fill="#2A2A2A"/><rect x="300.0" y="664" width="28.4" height="26" rx="13.0" fill="#7A7A7A"/><text x="314.2" y="682.0" font-size="14" font-weight="900" fill="#0B0B0B" text-anchor="middle">C</text><text x="368" y="684" font-size="20" font-weight="900" fill="#7A7A7A" text-anchor="end"><tspan x="368" dy="0">10</tspan></text><rect x="380" y="672" width="110" height="10" rx="5" fill="#333"/><rect x="380" y="672" width="27.5" height="10" rx="5" fill="#7A7A7A"/><text x="508" y="683" font-size="15" font-weight="500" fill="#B3B3B3" text-anchor="start"><tspan x="508" dy="0">발표는 했으나 조사한 내용이 정확하게 전달되지 않음</tspan></text><text x="56" y="746" font-size="13.5" font-weight="500" fill="#7A7A7A" text-anchor="start"><tspan x="56" dy="0">※ 본인 의사에 의한 미응시 · 결과물 미제출 10점 / 학업성적관리규정에 의한 미응시자 · 결시생은 규정에 따라 처리</tspan></text><text x="56" y="768" font-size="13.5" font-weight="700" fill="#B3B3B3" text-anchor="start"><tspan x="56" dy="0">성취도: 성취율 80% 이상 A · 60% 이상 80% 미만 B · 60% 미만 C</tspan></text>
<text x="1070" y="784" font-size="13" font-weight="500" fill="#555555" text-anchor="end"><tspan x="1070" dy="0">음악산업탐구 · 단원 설계</tspan></text>
