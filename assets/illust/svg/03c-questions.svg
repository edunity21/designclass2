<rect x="56.0" y="44" width="41.5" height="28" rx="14.0" fill="#F5A524"/><text x="76.7" y="63.4" font-size="15" font-weight="800" fill="#0B0B0B" text-anchor="middle">02</text><text x="109.49765625" y="63" font-size="16" font-weight="600" fill="#B3B3B3" text-anchor="start" letter-spacing="0.5"><tspan x="109.49765625" dy="0">핵심질문과 차시별 탐구질문</tspan></text><text x="56" y="120" font-size="38" font-weight="800" fill="#FFFFFF" text-anchor="start" letter-spacing="-0.6"><tspan x="56" dy="0">사실에서 개념으로, 개념에서 논쟁으로</tspan></text>
<rect x="56" y="158" width="998" height="70" rx="18" fill="#0E2A18" stroke="#1DB954" stroke-width="2"/><g transform="translate(80 181) scale(1.0000)" fill="none" stroke="#1DB954" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m16.24 7.76-1.804 5.411a2 2 0 0 1-1.265 1.265L7.76 16.24l1.804-5.411a2 2 0 0 1 1.265-1.265z" />
  <circle cx="12" cy="12" r="10" /></g><text x="116" y="201" font-size="16" font-weight="800" fill="#1DB954" text-anchor="start"><tspan x="116" dy="0">핵심질문</tspan></text><text x="200" y="202" font-size="22" font-weight="700" fill="#FFFFFF" text-anchor="start"><tspan x="200" dy="0">음악이 사라지면, 그 산업에서는 무엇이 함께 사라지는가?</tspan></text><path d="M150,790 L1010,300" stroke="#1DB954" stroke-width="100" opacity="0.06" stroke-linecap="round"/><rect x="56.0" y="652" width="700" height="104" rx="16" fill="#1E1E1E"/><rect x="56.0" y="652" width="7" height="104" rx="3" fill="#4D8DFF"/><rect x="80.0" y="666" width="81.4" height="24" rx="12.0" fill="#4D8DFF"/><text x="120.7" y="682.9" font-size="13.5" font-weight="800" fill="#0B0B0B" text-anchor="middle">사실적 질문</text><text x="171.35328125" y="683" font-size="14" font-weight="700" fill="#B3B3B3" text-anchor="start"><tspan x="171.35328125" dy="0">1~2차시</tspan></text><text x="80.0" y="716" font-size="17.5" font-weight="600" fill="#FFFFFF" text-anchor="start"><tspan x="80.0" dy="0">내가 고른 산업은 무엇을 만들고 누구에게 전하는가? 그 산업에는 어떤 직업이 있고 각각 무슨</tspan><tspan x="80.0" dy="24.1">일을 하는가?</tspan></text><text x="738.0" y="686" font-size="20" font-weight="900" fill="#333333" text-anchor="end"><tspan x="738.0" dy="0">Q1</tspan></text><rect x="155.3" y="534" width="700" height="104" rx="16" fill="#1E1E1E"/><rect x="155.3" y="534" width="7" height="104" rx="3" fill="#1DB954"/><rect x="179.3" y="548" width="81.4" height="24" rx="12.0" fill="#1DB954"/><text x="220.0" y="564.9" font-size="13.5" font-weight="800" fill="#0B0B0B" text-anchor="middle">개념적 질문</text><text x="270.65328125" y="565" font-size="14" font-weight="700" fill="#B3B3B3" text-anchor="start"><tspan x="270.65328125" dy="0">2차시</tspan></text><text x="179.3" y="598" font-size="17.5" font-weight="600" fill="#FFFFFF" text-anchor="start"><tspan x="179.3" dy="0">그 산업에서 음악은 어떤 장면에 쓰이며, 음악이 빠지면 그 장면의 값어치는 어떻게</tspan><tspan x="179.3" dy="24.1">달라지는가?</tspan></text><text x="837.3" y="568" font-size="20" font-weight="900" fill="#333333" text-anchor="end"><tspan x="837.3" dy="0">Q2</tspan></text><rect x="254.6" y="416" width="700" height="104" rx="16" fill="#1E1E1E"/><rect x="254.6" y="416" width="7" height="104" rx="3" fill="#1DB954"/><rect x="278.6" y="430" width="81.4" height="24" rx="12.0" fill="#1DB954"/><text x="319.3" y="446.9" font-size="13.5" font-weight="800" fill="#0B0B0B" text-anchor="middle">개념적 질문</text><text x="369.95328125000003" y="447" font-size="14" font-weight="700" fill="#B3B3B3" text-anchor="start"><tspan x="369.95328125000003" dy="0">3차시</tspan></text><text x="278.6" y="480" font-size="17.5" font-weight="600" fill="#FFFFFF" text-anchor="start"><tspan x="278.6" dy="0">1분 안에 친구를 설득하려면 무엇을 남기고 무엇을 덜어내야 하는가?</tspan></text><text x="936.6" y="450" font-size="20" font-weight="900" fill="#333333" text-anchor="end"><tspan x="936.6" dy="0">Q3</tspan></text><rect x="353.9" y="298" width="700" height="104" rx="16" fill="#1E1E1E"/><rect x="353.9" y="298" width="7" height="104" rx="3" fill="#F5A524"/><rect x="377.9" y="312" width="81.4" height="24" rx="12.0" fill="#F5A524"/><text x="418.6" y="328.9" font-size="13.5" font-weight="800" fill="#0B0B0B" text-anchor="middle">논쟁적 질문</text><text x="469.25328125" y="329" font-size="14" font-weight="700" fill="#B3B3B3" text-anchor="start"><tspan x="469.25328125" dy="0">4차시</tspan></text><text x="377.9" y="362" font-size="17.5" font-weight="600" fill="#FFFFFF" text-anchor="start"><tspan x="377.9" dy="0">AI가 음악을 만드는 시대에도 음악 산업의 일은 사람의 몫으로 남을까?</tspan></text><text x="1035.9" y="332" font-size="20" font-weight="900" fill="#333333" text-anchor="end"><tspan x="1035.9" dy="0">Q4</tspan></text><text x="56" y="288" font-size="15" font-weight="800" fill="#B3B3B3" text-anchor="start"><tspan x="56" dy="0">질문이 깊어지는 순서</tspan></text><circle cx="64" cy="316" r="7" fill="#4D8DFF"/><text x="80" y="322" font-size="16" font-weight="800" fill="#4D8DFF" text-anchor="start"><tspan x="80" dy="0">사실적</tspan></text><text x="129.48250000000002" y="322" font-size="13.5" font-weight="500" fill="#B3B3B3" text-anchor="start"><tspan x="129.48250000000002" dy="0">내용을 확인한다</tspan></text><circle cx="64" cy="358" r="7" fill="#1DB954"/><text x="80" y="364" font-size="16" font-weight="800" fill="#1DB954" text-anchor="start"><tspan x="80" dy="0">개념적</tspan></text><text x="129.48250000000002" y="364" font-size="13.5" font-weight="500" fill="#B3B3B3" text-anchor="start"><tspan x="129.48250000000002" dy="0">개념 사이의 관계를 묻는다</tspan></text><circle cx="64" cy="400" r="7" fill="#F5A524"/><text x="80" y="406" font-size="16" font-weight="800" fill="#F5A524" text-anchor="start"><tspan x="80" dy="0">논쟁적</tspan></text><text x="129.48250000000002" y="406" font-size="13.5" font-weight="500" fill="#B3B3B3" text-anchor="start"><tspan x="129.48250000000002" dy="0">관점에 따라 답이 갈린다</tspan></text><text x="1054" y="716" font-size="15" font-weight="600" fill="#7A7A7A" text-anchor="end"><tspan x="1054" dy="0">차시별 탐구질문은</tspan></text><text x="1054" y="738" font-size="15" font-weight="600" fill="#7A7A7A" text-anchor="end"><tspan x="1054" dy="0">수업 활동과 평가로 이어진다 →</tspan></text>
<text x="1070" y="784" font-size="13" font-weight="500" fill="#555555" text-anchor="end"><tspan x="1070" dy="0">음악산업탐구 · 단원 설계</tspan></text>
</g>
