width="190.0" height="340" rx="16" fill="#1E1E1E"/><rect x="460.0" y="312" width="190.0" height="5" rx="2" fill="#1DB954"/><text x="476.0" y="350" font-size="17" font-weight="900" fill="#1DB954" text-anchor="start"><tspan x="476.0" dy="0">활동 2 · 12′</tspan></text><text x="476.0" y="384" font-size="14.5" font-weight="600" fill="#FFFFFF" text-anchor="start"><tspan x="476.0" dy="0">음악의 활용 가치 — 6~8번</tspan></text><text x="476.0" y="412.5" font-size="14.5" font-weight="600" fill="#FFFFFF" text-anchor="start"><tspan x="476.0" dy="0">7번: 음악을 모두</tspan><tspan x="476.0" dy="20.0">지웠다고 상상</tspan></text><text x="476.0" y="461.01" font-size="14.5" font-weight="600" fill="#FFFFFF" text-anchor="start"><tspan x="476.0" dy="0">짝 점검 2′</tspan></text><rect x="470.0" y="578" width="170.0" height="60" rx="12" fill="#2A2A2A"/><text x="482.0" y="603" font-size="14" font-weight="700" fill="#F5C518" text-anchor="start"><tspan x="482.0" dy="0">“음악을 지우면 누가</tspan><tspan x="482.0" dy="18.9">곤란해질까?”</tspan></text><path d="M821.1333333333334,272 L757.0,312" stroke="#F5A524" stroke-width="1.5" opacity="0.5"/><rect x="662.0" y="312" width="190.0" height="340" rx="16" fill="#1E1E1E"/><rect x="662.0" y="312" width="190.0" height="5" rx="2" fill="#F5A524"/><text x="678.0" y="350" font-size="17" font-weight="900" fill="#F5A524" text-anchor="start"><tspan x="678.0" dy="0">활동 3 · 7′</tspan></text><text x="678.0" y="384" font-size="14.5" font-weight="600" fill="#FFFFFF" text-anchor="start"><tspan x="678.0" dy="0">핵심 세 문장 — 9번</tspan></text><text x="678.0" y="412.5" font-size="14.5" font-weight="600" fill="#FFFFFF" text-anchor="start"><tspan x="678.0" dy="0">무슨 분야인가 / 어떻게</tspan><tspan x="678.0" dy="20.0">쓰이는가 / 왜 중요한가</tspan></text><text x="678.0" y="461.01" font-size="14.5" font-weight="600" fill="#FFFFFF" text-anchor="start"><tspan x="678.0" dy="0">[지금 제출하기]</tspan></text><path d="M976.3777777777779,272 L959.0,312" stroke="#EC4899" stroke-width="1.5" opacity="0.5"/><rect x="864.0" y="312" width="190.0